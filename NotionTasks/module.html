<style>
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif}:root{--bg:#f6f6f3;--card:#fff;--text:#20201e;--muted:#6c6c66;--border:#e6e6e1;--red:#e56458;--orange:#d5803b;--blue:#2783de;--green:#46a171}#ntasks{background:var(--bg);color:var(--text);border-radius:12px;padding:14px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.title{font-weight:800;font-size:18px}.meta{color:var(--muted);font-size:12px}.list{display:flex;flex-direction:column;gap:8px}.task{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 10px}.top{display:flex;gap:8px;justify-content:space-between}.name{font-weight:650;line-height:1.25}.pill{font-size:11px;border-radius:999px;padding:2px 7px;background:#eee;white-space:nowrap}.prio-ASAP{background:#efe8ff}.prio-hohe{background:#fce9e7}.prio-mittlere{background:#fbebde}.prio-niedrige{background:#e5f2fc}.due{font-size:12px;color:var(--muted);margin-top:5px}.overdue{color:var(--red);font-weight:700}.today{color:var(--orange);font-weight:700}.empty,.err{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;color:var(--muted)}.err{color:var(--red)}a{color:inherit;text-decoration:none}</style>
<div id="ntasks"><div class="head"><div><div class="title">Aktuelle Aufgaben</div><div class="meta" id="meta">–</div></div><div class="meta" id="count"></div></div><div id="content" class="list"></div></div>
<script>
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmtDate(d){if(!d)return '';let x=new Date(d+'T00:00:00');if(isNaN(x))return d;return x.toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'})}
function dueClass(d){if(!d)return '';let today=new Date();today.setHours(0,0,0,0);let x=new Date(d+'T00:00:00');if(isNaN(x))return '';if(x<today)return 'overdue';if(+x===+today)return 'today';return ''}
function render(data){let c=document.getElementById('content'); if(data.error){c.innerHTML='<div class="err">'+esc(data.error)+'</div>';return} let items=data.tasks||[]; document.getElementById('meta').textContent=data.updatedAt?'Stand '+data.updatedAt:'Notion Aufgaben'; document.getElementById('count').textContent=items.length+' offen'; if(!items.length){c.innerHTML='<div class="empty">Keine aktuellen Aufgaben gefunden.</div>';return} c.innerHTML=items.map(t=>{let pc='prio-'+String(t.priority||'').split(' ')[0];let dc=dueClass(t.due);let href=t.url?' href="'+esc(t.url)+'" target="_blank"':'';return '<div class="task"><div class="top"><a class="name"'+href+'>'+esc(t.title||'Ohne Titel')+'</a>'+(t.priority?'<span class="pill '+pc+'">'+esc(t.priority)+'</span>':'')+'</div><div class="due '+dc+'">'+(t.due?fmtDate(t.due):'ohne Datum')+(t.status?' · '+esc(t.status):'')+'</div></div>'}).join('')}
let __hasNotionData=false;
function handleMessage(x){__hasNotionData=true;render(typeof x==='string'?JSON.parse(x):x)}
setTimeout(function(){if(!__hasNotionData){render({updatedAt:'Warte auf Notion-Daten',tasks:[]})}},500)
</script>
